# Manifiesto maestro de estructura y metadatos del libro (Opción A)
#
# Este archivo define el orden de lectura, la agrupación en partes y los metadatos
# de la Segunda Edición. Los nombres de archivo en `libro/` actúan como IDs estables;
# si decides reordenar ensayos, moverlos de parte o añadir nuevos capítulos, basta con
# editar este manifiesto y ejecutar:
#   - python3 scripts/edicion/validar_libro.py
#   - python3 scripts/edicion/generar_indice.py --escribir
#   - python3 scripts/edicion/compilar_pdf.py

